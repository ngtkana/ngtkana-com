name: Claude Code PR Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # フォークからの PR には Secrets が渡らず必ず失敗するので、同じリポジトリのブランチからの PR だけにする
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    # 普段は1分ほどで終わる。止まったときに料金と CI 時間を使い続けないように打ち切る
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            LANGUAGE: ja

            このPRの差分をレビューしてください。
            - バグ、設計上の問題、改善点があれば日本語で具体的に指摘する
            - CLAUDE.md の運用ルールに沿っているか、設計・規約・ディレクトリ構成に影響する変更なら対応する docs/*.md も同じPRで更新されているかを確かめる
            - 指摘が無ければその旨を簡潔に述べる

            レビューコメントの最後に、区切り線を挟んで次のリンクを追記する:
            [Anthropic Console で使用量を確認](https://console.anthropic.com)
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(gh pr diff:*),Read,Grep,Glob"
